name: Sync Garmin to Notion

on:
  schedule:
    # 每天北京时间早上 9 点运行 (UTC 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动点

env:
  TZ: 'Asia/Shanghai'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Sync Garmin health facts to Agent Signals
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          NOTION_AGENT_SIGNALS_TOKEN: ${{ secrets.NOTION_AGENT_SIGNALS_TOKEN }}
          NOTION_AGENT_SIGNALS_DATA_SOURCE_ID: ${{ secrets.NOTION_AGENT_SIGNALS_DATA_SOURCE_ID }}
          TZ: 'Asia/Shanghai'
        run: |
          python garmin-agent-signals.py
